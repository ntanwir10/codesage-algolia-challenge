<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search and explore GitHub repositories through the Model Context Protocol (MCP), with Algolia-powered code search" />
    <meta name="theme-color" content="#6366f1" />
    <title>CodeSage - AI-Powered Code Discovery</title>
    <script>
      // Before the first paint, so a dark page never flashes light: the saved choice, else the system's
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // Storage blocked: follow the default (light)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
