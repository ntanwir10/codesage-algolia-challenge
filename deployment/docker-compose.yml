version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesage_mcp_server
    ports:
      - "8001:8001" # HTTP API and WebSocket on same port
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_data:/app/data # SQLite database storage
    env_file:
      - backend/.env
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:5173"]
      - DATABASE_URL=sqlite:///./data/codesage.db # Use data directory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_data: # Persistent SQLite database storage

networks:
  default:
    driver: bridge
