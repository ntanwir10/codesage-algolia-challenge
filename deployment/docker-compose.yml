services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: codesage_mcp_server
    ports:
      - "8001:8001" # HTTP API and WebSocket on same port
    volumes:
      - ../backend:/app
      - backend_data:/app/data # SQLite database storage (writable by appuser)
    env_file:
      - ../backend/.env
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:5173 # comma-separated
      - DATABASE_URL=sqlite:///./data/codesage.db
      # Algolia records are keyed by repository id, so this database must not
      # share an index with a local one (they'd delete each other's records)
      - ALGOLIA_INDEX_NAME=${DOCKER_ALGOLIA_INDEX_NAME:-codesage_code_entities_docker}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Single worker: WebSocket/rate-limit/job state are in-process
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir app
    restart: unless-stopped

  # nginx: serves the built frontend and proxies /api, /ws and /health to backend
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        # Must match CODESAGE_API_KEY in backend/.env; export it before building
        VITE_CODESAGE_API_KEY: ${CODESAGE_API_KEY:-}
    container_name: codesage_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data: # Persistent SQLite database storage

networks:
  default:
    driver: bridge
