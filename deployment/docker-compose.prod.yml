version: "3.8"

services:
  # CodeSage MCP Server (Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: codesage_mcp_server_prod
    ports:
      - "8001:8001"
    volumes:
      - backend_uploads_prod:/app/uploads
      - backend_data_prod:/app/data # SQLite database storage
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/codesage.db
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - ENVIRONMENT=production
      - CORS_ORIGINS=["https://yourdomain.com"] # Update with your domain
    networks:
      - codesage_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: codesage_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro # SSL certificates (optional)
    depends_on:
      - backend
    networks:
      - codesage_network
    restart: unless-stopped

volumes:
  backend_uploads_prod:
  backend_data_prod: # Persistent SQLite database storage

networks:
  codesage_network:
    driver: bridge
