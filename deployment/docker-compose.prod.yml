services:
  # CodeSage MCP Server (Production) - exactly one uvicorn worker (see Dockerfile.prod)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: codesage_mcp_server_prod
    # Not published: nginx proxies /api, /ws and /health over codesage_network
    volumes:
      - backend_data_prod:/app/data # SQLite database storage
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/codesage.db
      # One source for the key: the shell. nginx gets the same value below, and the
      # backend refuses to start without it because it binds 0.0.0.0.
      - CODESAGE_API_KEY=${CODESAGE_API_KEY:-}
      # Algolia records are keyed by repository id, so this database must not
      # share an index with any other one (they'd delete each other's records)
      - ALGOLIA_INDEX_NAME=${PROD_ALGOLIA_INDEX_NAME:-codesage_code_entities_prod}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - ENVIRONMENT=production
      - CORS_ORIGINS=https://yourdomain.com # comma-separated; update with your domain
    networks:
      - codesage_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # nginx (Production): serves the built frontend, proxies /api, /ws, /health
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        # No VITE_CODESAGE_API_KEY: nginx adds the key, so it never ships to browsers
    container_name: codesage_nginx_prod
    ports:
      - "80:80"   # /health and a redirect to HTTPS only
      - "443:443"
    environment:
      # Same exported value as the backend's; export it before `up`
      - CODESAGE_API_KEY=${CODESAGE_API_KEY:-}
      - NGINX_ENVSUBST_FILTER=^CODESAGE_API_KEY$$
    volumes:
      - ./nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      # create_host_path: false makes a missing file fail at start instead of
      # silently becoming an empty directory that nginx then can't read
      # Create with: docker run --rm httpd:alpine htpasswd -nbB <user> <password> > deployment/htpasswd
      - type: bind
        source: ./htpasswd
        target: /etc/nginx/htpasswd
        read_only: true
        bind:
          create_host_path: false
      # cert.pem and key.pem; see DOCKER.md for a self-signed pair
      - type: bind
        source: ./ssl
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codesage_network
    restart: unless-stopped

volumes:
  backend_data_prod: # Persistent SQLite database storage

networks:
  codesage_network:
    driver: bridge
