services:
  # CodeSage MCP Server (Production) - exactly one uvicorn worker (see Dockerfile.prod)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: codesage_mcp_server_prod
    ports:
      - "8001:8001"
    volumes:
      - backend_data_prod:/app/data # SQLite database storage
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/codesage.db
      # Algolia records are keyed by repository id, so this database must not
      # share an index with any other one (they'd delete each other's records)
      - ALGOLIA_INDEX_NAME=${PROD_ALGOLIA_INDEX_NAME:-codesage_code_entities_prod}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - ENVIRONMENT=production
      - CORS_ORIGINS=https://yourdomain.com # comma-separated; update with your domain
    networks:
      - codesage_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # nginx (Production): serves the built frontend, proxies /api, /ws, /health
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        # Must match CODESAGE_API_KEY in backend/.env; export it before building
        VITE_CODESAGE_API_KEY: ${CODESAGE_API_KEY:-}
    container_name: codesage_nginx
    ports:
      - "80:80"
      # 443 is not published: TLS is not configured in nginx.conf. Once the HTTPS
      # server block is enabled and ./ssl is populated, add "443:443" and
      # mount ./ssl:/etc/nginx/ssl:ro.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codesage_network
    restart: unless-stopped

volumes:
  backend_data_prod: # Persistent SQLite database storage

networks:
  codesage_network:
    driver: bridge
