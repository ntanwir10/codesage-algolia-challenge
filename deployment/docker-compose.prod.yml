services:
  # CodeSage MCP Server (Production): API_WORKERS uvicorn processes, 1 by default. More than 1
  # needs the scale profile's Redis and workers (DOCKER.md, "More than one API process")
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: codesage_mcp_server_prod
    # Not published: nginx proxies /api, /ws and /health over codesage_network
    volumes:
      - backend_data_prod:/app/data # SQLite database storage
    env_file:
      - ../backend/.env
    # A local Ollama (EMBEDDING_API_URL) runs on the host: Docker Desktop and OrbStack map this
    # name themselves, Linux Docker Engine only with this line
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - &database_url DATABASE_URL=sqlite:///./data/codesage.db
      # One source for the key: the shell. nginx gets the same value below, and the
      # backend refuses to start without it because it binds 0.0.0.0.
      - CODESAGE_API_KEY=${CODESAGE_API_KEY:-}
      # Algolia records are keyed by repository id, so this database must not
      # share an index with any other one (they'd delete each other's records)
      - &algolia_index ALGOLIA_INDEX_NAME=${PROD_ALGOLIA_INDEX_NAME:-codesage_code_entities_prod}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - ENVIRONMENT=production
      - CORS_ORIGINS=https://yourdomain.com # comma-separated; update with your domain
      # Hosts the API answers to besides loopback and the CORS_ORIGINS hosts (comma-separated,
      # no port); any other Host gets 403, which blocks DNS rebinding
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # More than one API process: API_WORKERS=2, INDEX_WORKERS=external and
      # RATE_LIMIT_STORAGE_URL=redis://redis:6379, with --profile scale for Redis and the workers
      - API_WORKERS=${API_WORKERS:-1}
      - INDEX_WORKERS=${INDEX_WORKERS:-inline}
      - RATE_LIMIT_STORAGE_URL=${RATE_LIMIT_STORAGE_URL:-}
    networks:
      - codesage_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # --profile scale: indexing workers (INDEX_WORKERS=external), as many as --scale worker=N.
  # Same image, database and index as the backend, which migrates the database first
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    profiles: [scale]
    command: ["python", "-m", "app.worker"]
    volumes:
      - backend_data_prod:/app/data
    env_file:
      - ../backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - *database_url
      - *algolia_index
      - ENVIRONMENT=production
      - INDEX_WORKERS=external
    networks:
      - codesage_network
    healthcheck:
      disable: true # the image's check is the API's /health; a worker serves nothing
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # --profile scale: rate-limit counters shared by every API process. Counters only, so no persistence
  redis:
    image: redis:7.4-alpine
    profiles: [scale]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - codesage_network
    restart: unless-stopped

  # nginx (Production): serves the built frontend, proxies /api, /ws, /health
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        # No VITE_CODESAGE_API_KEY: nginx adds the key, so it never ships to browsers
    container_name: codesage_nginx_prod
    ports:
      - "80:80"   # /health and a redirect to HTTPS only
      - "443:443"
    environment:
      # Same exported value as the backend's; export it before `up`
      - CODESAGE_API_KEY=${CODESAGE_API_KEY:-}
      - NGINX_ENVSUBST_FILTER=^CODESAGE_API_KEY$$
    volumes:
      - ./nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      # create_host_path: false makes a missing file fail at start instead of
      # silently becoming an empty directory that nginx then can't read
      # Create with: docker run --rm httpd:alpine htpasswd -nbB <user> <password> > deployment/htpasswd
      - type: bind
        source: ./htpasswd
        target: /etc/nginx/htpasswd
        read_only: true
        bind:
          create_host_path: false
      # cert.pem and key.pem; see DOCKER.md for a self-signed pair
      - type: bind
        source: ./ssl
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codesage_network
    restart: unless-stopped

volumes:
  backend_data_prod: # Persistent SQLite database storage

networks:
  codesage_network:
    driver: bridge
