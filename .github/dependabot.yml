# Weekly update PRs, gated by CI like any other PR. Minor and patch bumps arrive as one PR per
# ecosystem; each major bump gets its own, since it can need code changes.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images in backend/Dockerfile, backend/Dockerfile.prod and frontend/Dockerfile
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
