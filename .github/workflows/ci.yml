name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only token: no job writes to the repository
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../scripts
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present

  # Playwright against an isolated backend and Vite server (frontend/playwright.config.ts)
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose reads backend/.env via env_file. Throwaway values: the backend binds 0.0.0.0 in
      # the container, so it needs a key, and the Algolia keys are fake (health reports "degraded")
      - run: >-
          printf '%s\n' CODESAGE_API_KEY=ci-smoke-key ALGOLIA_APP_ID=CISMOKE000
          ALGOLIA_ADMIN_API_KEY=ci-dummy-key > backend/.env
      - run: docker compose -f deployment/docker-compose.yml config -q
      - run: docker compose -f deployment/docker-compose.prod.yml config -q
      - run: docker build -f backend/Dockerfile.prod backend
      # nginx -t resolves upstream hosts, so map "backend" to a dummy address
      - name: nginx -t (dev config)
        run: >-
          docker run --rm --add-host backend:127.0.0.1
          -v "$PWD/deployment/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t
      - name: nginx -t (prod template)
        run: |
          mkdir -p "$RUNNER_TEMP/ssl"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout "$RUNNER_TEMP/ssl/key.pem" -out "$RUNNER_TEMP/ssl/cert.pem"
          echo 'ci:$apr1$ci$ci' > "$RUNNER_TEMP/htpasswd"
          docker run --rm --add-host backend:127.0.0.1 -e CODESAGE_API_KEY=ci \
            -e 'NGINX_ENVSUBST_FILTER=^CODESAGE_API_KEY$' \
            -v "$PWD/deployment/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$RUNNER_TEMP/htpasswd:/etc/nginx/htpasswd:ro" -v "$RUNNER_TEMP/ssl:/etc/nginx/ssl:ro" \
            nginx:alpine sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
      # Smoke test: run the dev stack (this also builds the frontend image) and check both containers answer
      - name: Start the dev stack
        env:
          CODESAGE_API_KEY: ci-smoke-key # baked into the frontend bundle, as on a laptop
        run: docker compose -f deployment/docker-compose.yml up -d --build
      - name: Wait for the backend
        run: |
          for _ in $(seq 60); do
            curl -fsS localhost:8001/health && exit 0
            sleep 2
          done
          exit 1
      - name: Check nginx serves the app and proxies the API
        run: |
          curl -fsS localhost/ | grep -q '<div id="root">'
          curl -fsS localhost/health | jq -e '.components.database.status == "healthy"'
          curl -fsS -H 'X-API-Key: ci-smoke-key' localhost/api/v1/repositories/ | jq -e 'length == 0'
      - if: failure()
        run: docker compose -f deployment/docker-compose.yml logs
      - if: always()
        run: docker compose -f deployment/docker-compose.yml down -v
